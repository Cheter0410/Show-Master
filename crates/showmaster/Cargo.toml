[package]
name = "showmaster"
description = "Show Master - playback and show control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
sm-core.workspace = true
sm-server.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time"] }

# Used only when building for Windows (also when cross-compiling from Linux with MinGW).
[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[package.metadata.deb]
name = "showmaster"
maintainer = "Show Master"
section = "sound"
priority = "optional"
depends = "libasound2 | libasound2t64"
extended-description = "Cue-based playback and show control for live production. Runs fully offline."
assets = [
  ["target/release/showmaster", "usr/bin/", "755"],
  ["../../packaging/linux/showmaster.desktop", "usr/share/applications/", "644"],
  ["../../README.md", "usr/share/doc/showmaster/", "644"],
]
