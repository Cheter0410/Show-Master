[package]
name = "sm-desktop"
description = "Native desktop user interface of Show Master (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt"] }
sm-core.workspace = true
sm-server.workspace = true
sm-audio.workspace = true
# System-wide hotkeys (X11, Windows RegisterHotKey, macOS RegisterEventHotKey).
global-hotkey = "=0.10.0"

# Receiving "open documents" / "reopen" events and the app menu (Cmd+W, Cmd+Q).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["objc2-core-services", "NSAppleEventManager", "NSAppleEventDescriptor", "NSString", "NSURL", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

# Tray icon (menu bar on macOS, notification area on Windows): the app keeps
# running in the background when the window is closed.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }

# Linux: StatusNotifierItem over D-Bus (KDE, GNOME with the AppIndicator
# extension, ...); no GTK main loop or libappindicator needed.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.7", default-features = false, features = ["tokio"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
sm-io.workspace = true

[lints]
workspace = true
