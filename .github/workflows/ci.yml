name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Run the soak test for this many seconds (0 = skip)"
        default: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every push is tested on Linux. macOS and Windows runners are expensive on private
        # repositories (macOS minutes count tenfold), so the full matrix runs for pull
        # requests, tags and manual runs only. Intel Macs are covered by the universal build;
        # the Intel runner is slow and costs most.
        include: ${{ fromJSON((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) && '[{"name":"Linux x86_64","os":"ubuntu-24.04"}]' || '[{"name":"Linux x86_64","os":"ubuntu-24.04"},{"name":"Linux aarch64","os":"ubuntu-24.04-arm"},{"name":"macOS Apple Silicon","os":"macos-15"},{"name":"Windows","os":"windows-2022"}]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config strace

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Web UI - install, test, build
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Offline proof (no network needed, none attempted)
        if: runner.os == 'Linux'
        run: ./scripts/offline-test.sh

      - name: Release build
        run: cargo build --release --locked -p showmaster

      - name: Start-up and memory benchmark
        if: runner.os != 'Windows'
        run: ./scripts/bench-startup.sh

      - name: Soak test
        if: github.event_name == 'workflow_dispatch' && inputs.soak_seconds != '0'
        env:
          SM_SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: cargo test --release --locked -p sm-server --test soak -- --ignored --nocapture

      - name: Portable package
        shell: bash
        run: ./packaging/portable.sh

      - uses: actions/upload-artifact@v4
        with:
          name: showmaster-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  deb:
    name: Debian package
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo deb -p showmaster --locked
      - uses: actions/upload-artifact@v4
        with:
          name: showmaster-deb
          path: target/debian/*.deb
