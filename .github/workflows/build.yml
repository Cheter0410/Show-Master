# Builds the installers: ShowMaster-x.y.z.dmg (macOS, universal), ShowMaster-Setup-x.y.z.exe
# (Windows), showmaster_x.y.z_amd64.deb (Linux), plus the small program-only files the in-app
# updater uses. Runs for version tags and on demand.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build app and disk image
        run: ./packaging/macos/build-dmg.sh
      - name: Smoke test the packaged app
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" dist/ShowMaster-*.dmg
          cp -R "$MNT/ShowMaster.app" /tmp/ShowMaster.app
          hdiutil detach "$MNT"
          BIN=/tmp/ShowMaster.app/Contents/MacOS/showmaster
          "$BIN" --version
          # Started the way a double click does, minus the browser; no update check in CI.
          SHOWMASTER_NO_UPDATE_CHECK=1 "$BIN" --no-open --port 7455 --local-only --log-dir /tmp/sm-logs --make-demo /tmp/sm-demo &
          for i in $(seq 1 100); do curl -fs http://127.0.0.1:7455/api/session >/dev/null 2>&1 && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:7455/api/session | grep -q '"role":"admin"'
          curl -fsS http://127.0.0.1:7455/ | grep -qi '<!doctype html'
          curl -fsS http://127.0.0.1:7455/api/v1/cmd/go | grep -q '"ok":true'
          sleep 1
          curl -fsS http://127.0.0.1:7455/api/v1/state | python3 -c 'import json,sys; s=json.load(sys.stdin); print("audio:", s["audio"]["backend"], s["audio"]["device"], "| active cues:", len(s["tick"]["active"]), "| update:", s["update"]["state"]); assert s["update"]["state"]=="disabled"; assert len(s["tick"]["active"])>=1'
          # A second start must hand over to the running instance and exit.
          "$BIN" --no-open --port 7455 --local-only --log-dir /tmp/sm-logs2
          # Quit through the API, as the Quit button does.
          curl -fsS -X POST -H 'content-type: application/json' -d '{"cmd":"quit","force":true}' http://127.0.0.1:7455/api/v1/command | grep -q '"ok":true'
          wait
          echo "packaged app started, played, handed over and quit cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: ShowMaster-macOS
          path: |
            dist/*.dmg
            dist/*.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p showmaster
      - name: Build installer
        shell: pwsh
        run: |
          $v = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq "showmaster" }).version
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item target/release/showmaster.exe stage/
          Copy-Item README.md stage/
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\showmaster.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          7z a -tgzip -mx=9 "dist\showmaster-windows-x86_64.gz" target\release\showmaster.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\ShowMaster-Setup-*.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=C:\sm-test" -Wait
          if (-not (Test-Path C:\sm-test\showmaster.exe)) { throw "installer did not install the program" }
          $env:SHOWMASTER_NO_UPDATE_CHECK = "1"
          $p = Start-Process -FilePath C:\sm-test\showmaster.exe -ArgumentList "--port","7455","--local-only","--log-dir","C:\sm-logs" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 100; $i++) { try { $r = Invoke-RestMethod http://127.0.0.1:7455/api/session; if ($r.role -eq "admin") { $ok = $true; break } } catch { Start-Sleep -Milliseconds 100 } }
          if (-not $ok) { throw "installed program did not answer" }
          $q = Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"cmd":"quit","force":true}' http://127.0.0.1:7455/api/v1/command
          if (-not $q.ok) { throw "quit failed" }
          if (-not $p.WaitForExit(10000)) { throw "program did not exit after quit" }
          Write-Host "installed program started and quit cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: ShowMaster-Windows
          path: |
            dist/*.exe
            dist/*.gz
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo deb -p showmaster --locked
      - name: Smoke test the package
        run: |
          set -euo pipefail
          sudo apt-get install -y ./target/debian/*.deb
          showmaster --version
          mkdir -p dist && cp target/debian/*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ShowMaster-Linux
          path: dist/*.deb
          if-no-files-found: error

  # Publishes the installers to the public downloads repository, where the in-app updater
  # finds them. Runs for version tags only, and only when the secret RELEASES_TOKEN (a token
  # that may write releases of show-master-releases) is set; without it, publish with
  # scripts/release.sh from your own computer.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      PUBLIC: Cheter0410/show-master-releases
    steps:
      - name: Check for the publishing token
        id: token
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No RELEASES_TOKEN secret: publish with scripts/release.sh instead."; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          path: out
      - name: Publish
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          WANT=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$V" != "$WANT" ]; then echo "Tag $TAG does not match version $WANT in Cargo.toml"; exit 1; fi
          NOTES=$(awk -v v="$V" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md | sed -e '/./,$!d')
          [ -n "$NOTES" ] || NOTES="Show Master $V"
          mapfile -t FILES < <(find out -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.gz' -o -name '*.deb' \))
          for want in '\.dmg' 'Setup-.*\.exe' 'windows-x86_64\.gz' 'macos-arm64\.gz' 'macos-x86_64\.gz' '\.deb'; do
            printf '%s\n' "${FILES[@]}" | grep -Eq "$want" || { echo "Missing a file matching $want"; exit 1; }
          done
          if gh release view "$TAG" -R "$PUBLIC" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$PUBLIC" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" -R "$PUBLIC" --title "Show Master $V" --notes "$NOTES" "${FILES[@]}"
          fi
          echo "Published $TAG to https://github.com/$PUBLIC/releases"
